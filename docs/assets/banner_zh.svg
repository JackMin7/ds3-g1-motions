<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">DS3 → G1：3,707 条动作数据</title>
  <desc id="desc">白底、深色文字和蓝色点缀。传火有新搭子，动作有新工位。29 个身体与手腕关节，BVH 和 CSV。</desc>
  <rect width="1280" height="390" rx="18" fill="#fff"/>
  <rect x="1" y="1" width="1278" height="388" rx="18" fill="none" stroke="#e7ecf2" stroke-width="2"/>
  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="58" y="57" fill="#285de5" font-size="20" letter-spacing="2">MOTION DATASET · RESEARCH PREVIEW</text>
    <text x="55" y="136" fill="#172231" font-size="67" font-weight="700">DS3 → G1</text>
    <text x="59" y="184" fill="#677587" font-size="27">传火有新搭子，动作有新工位。</text>
    <line x1="59" y1="219" x2="1221" y2="219" stroke="#e7ecf2" stroke-width="2"/>
    <text x="59" y="285" fill="#172231" font-size="48" font-weight="700">3,707</text>
    <text x="61" y="332" fill="#677587" font-size="22">条动作数据</text>
    <line x1="425" y1="251" x2="425" y2="339" stroke="#e7ecf2" stroke-width="2"/>
    <text x="469" y="285" fill="#172231" font-size="48" font-weight="700">29</text>
    <text x="471" y="332" fill="#677587" font-size="22">个身体与手腕关节</text>
    <line x1="817" y1="251" x2="817" y2="339" stroke="#e7ecf2" stroke-width="2"/>
    <text x="861" y="284" fill="#285de5" font-size="33" font-weight="700">BVH + CSV</text>
    <text x="863" y="332" fill="#677587" font-size="22">一段动作，两份文件</text>
  </g>
</svg>
